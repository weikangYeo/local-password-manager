<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Select Your Profile</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/app.css">
    <style>
        body {
            background-color: white;
        }

        .profile-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #202124;
            font-weight: 400;
        }

        .profiles-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 30px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            overflow: hidden;
        }

        .profile-row {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dadce0;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-row:hover {
            background-color: #f1f3f4;
        }

        .profile-row:active {
            background-color: #e8eaed;
        }

        .profile-row-content {
            flex: 1;
        }

        .profile-name {
            font-size: 0.875rem;
            color: #1a73e8;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .profile-email {
            font-size: 0.875rem;
            color: #5f6368;
        }

        .profile-chevron {
            color: #5f6368;
            font-size: 1.2rem;
            margin-left: 16px;
        }

        .create-button {
            background-color: rgb(14, 122, 254);
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 0.875rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: "Nunito", sans-serif;
            font-weight: 500;
        }

        .create-button:hover {
            background-color: rgb(12, 108, 224);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        }

        .create-button:active {
            background-color: rgb(10, 94, 194);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="profile-container">
            <h1>Select Your Profile</h1>
            
            <div class="profiles-list">
                <div class="profile-row" onclick="selectProfile('Profile 1')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 1</div>
                        <div class="profile-email">profile1@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 2')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 2</div>
                        <div class="profile-email">profile2@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 3')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 3</div>
                        <div class="profile-email">profile3@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 4')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 4</div>
                        <div class="profile-email">profile4@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 5')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 5</div>
                        <div class="profile-email">profile5@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 6')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 6</div>
                        <div class="profile-email">profile6@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 7')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 7</div>
                        <div class="profile-email">profile7@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
                <div class="profile-row" onclick="selectProfile('Profile 8')">
                    <div class="profile-row-content">
                        <div class="profile-name">Profile 8</div>
                        <div class="profile-email">profile8@example.com</div>
                    </div>
                    <div class="profile-chevron">›</div>
                </div>
            </div>

            <button class="create-button" onclick="createNewProfile()">Create a new Profile</button>
        </div>
    </div>

    <script>
        function selectProfile(profileName) {
            // Store the selected profile name in sessionStorage
            sessionStorage.setItem('selectedProfile', profileName);
            // Redirect to profile entry page
            window.location.href = 'profile-entry.html';
        }

        function createNewProfile() {
            // Redirect to create profile page
            window.location.href = 'create-profile.html';
        }
    </script>
</body>
</html>
